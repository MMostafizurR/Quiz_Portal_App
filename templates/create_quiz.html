{% extends 'base.html' %}
{% block title %}Create Quiz{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="mb-3">Step 1: Create New Quiz</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Next: Add Questions</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
