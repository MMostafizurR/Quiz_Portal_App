{% extends 'base.html' %}
{% block title %}Register - Quiz Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 mb-5">
            <h3 class="text-center mb-3">Register Portal Account</h3>
            <form method="POST">
                {% csrf_token %}
                
                <h5 class="text-secondary mt-2">Account Credentials</h5>
                {{ user_form.as_p }}

                <h5 class="text-secondary mt-4">Participant Details</h5>
                {{ participant_form.as_p }}

                <button type="submit" class="btn btn-primary w-100 mt-4">Register</button>
            </form>
            <div class="text-center mt-3">
                <small>Already have an account? <a href="{% url 'login' %}">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
