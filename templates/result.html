{% extends 'base.html' %}
{% block title %}Quiz Result{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow p-5">
            <h2 class="text-success mb-3">Quiz Submitted Successfully!</h2>
            <h4 class="mb-4">Quiz: {{ quiz.title }}</h4>
            
            <div class="display-4 fw-bold text-primary mb-3">
                {{ score }} / {{ total_questions }}
            </div>
            <p class="text-muted mb-4">Your final score has been calculated.</p>

            <a href="{% url 'dashboard' %}" class="btn btn-primary w-100">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
