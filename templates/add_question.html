{% extends 'base.html' %}
{% block title %}Add Question - {{ quiz.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4 mb-5">
            <h3 class="mb-2">Add Question for: <span class="text-primary">{{ quiz.title }}</span></h3>
            <hr>
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Question Text</label>
                    <textarea name="question" class="form-control" rows="2" placeholder="Enter question..." required></textarea>
                </div>

                <h5 class="mb-3">Options (Select the radio button for the correct answer):</h5>
                
                {% for i in "1234" %}
                <div class="input-group mb-3">
                    <div class="input-group-text">
                        <input class="form-check-input mt-0" type="radio" name="correct_option" value="{{ i }}" required title="Mark as correct">
                    </div>
                    <input type="text" name="option_{{ i }}" class="form-control" placeholder="Option {{ i }} text" required>
                </div>
                {% endfor %}

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" name="add_another" class="btn btn-primary">Save & Add Another</button>
                    <button type="submit" name="finish" class="btn btn-success">Save & Finish Quiz</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
